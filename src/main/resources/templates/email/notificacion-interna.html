<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva consulta</title>
</head>
<body style="margin:0; padding:0; background-color:#0A1024; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#E2E8F0;">

<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#0A1024; padding: 40px 20px;">
    <tr>
        <td align="center">

            <table role="presentation" cellpadding="0" cellspacing="0" width="600" style="max-width:600px; background-color:#0E172F; border:1px solid #1E293B; border-radius:8px; overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td style="padding: 24px 32px; background-color:#070D21; border-bottom:1px solid #1E293B;">
                        <p style="margin:0; font-size:11px; color:#14C9C0; letter-spacing:1.5px; text-transform:uppercase; font-weight:600;">
                            🔔 NUEVA CONSULTA
                        </p>
                        <h1 style="margin:4px 0 0 0; font-size:20px; font-weight:700; color:#FFFFFF; font-family: 'Space Grotesk', Arial, sans-serif;">
                            <span th:text="${consulta.numeroComprobante}">RC-2026-0003</span>
                        </h1>
                    </td>
                </tr>

                <!-- Datos -->
                <tr>
                    <td style="padding: 24px 32px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="font-size:14px; line-height:2;">
                            <tr>
                                <td style="color:#94A3B8; width:130px;">Cliente</td>
                                <td style="color:#FFFFFF; font-weight:600;" th:text="${consulta.nombreCliente}">Juan Pérez</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Teléfono</td>
                                <td style="color:#FFFFFF;" th:text="${consulta.telefono}">1145678901</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Email</td>
                                <td style="color:#FFFFFF;" th:text="${consulta.email != null ? consulta.email : '-'}">juan@mail.com</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Barrio</td>
                                <td style="color:#FFFFFF;" th:text="${consulta.barrioNombre}">Palermo</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Dirección</td>
                                <td style="color:#FFFFFF;" th:text="${consulta.direccion}">Av. Santa Fe 3200</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Equipo</td>
                                <td style="color:#FFFFFF;" th:text="${consulta.equipo != null ? consulta.equipo : '-'}">Notebook</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Problema</td>
                                <td style="color:#FFFFFF;" th:text="${consulta.descripcionProblema}">No enciende</td>
                            </tr>
                            <tr>
                                <td style="color:#94A3B8;">Traslado</td>
                                <td style="color:#3DE273; font-weight:600;" th:text="${costoFormateado}">$25.000</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CTA -->
                <tr>
                    <td style="padding: 0 32px 32px 32px; text-align:center;">
                        <a href="http://localhost:8080/admin/consultas"
                           style="display:inline-block; padding:12px 24px; background-color:#1E5FD9; color:#FFFFFF; font-size:13px; font-weight:600; text-decoration:none; border-radius:4px;">
                            Abrir en el panel admin →
                        </a>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
