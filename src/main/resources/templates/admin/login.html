<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Panel NOXAS</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                navy: '#0A1024',
                card: '#0E172F',
                'border-dim': '#1E293B',
                'border-bright': '#334155',
                primary: '#1E5FD9',
                'primary-hover': '#184EB8',
                teal: '#14C9C0',
                tertiary: '#3DE273',
                error: '#FF6B6B',
                muted: '#94A3B8',
              },
              fontFamily: {
                display: ['"Space Grotesk"', 'sans-serif'],
                body: ['Inter', 'sans-serif'],
              },
              borderRadius: { sm: '4px', md: '8px' },
            }
          }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background: #0A1024; }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
        .grid-bg {
          background-image:
            linear-gradient(rgba(30,41,59,0.5) 1px, transparent 1px),
            linear-gradient(90deg, rgba(30,41,59,0.5) 1px, transparent 1px);
          background-size: 32px 32px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 grid-bg">

<div class="w-full max-w-md">
    <!-- Card del login -->
    <div class="bg-card border border-border-dim rounded-md p-8 shadow-2xl">

        <!-- Logo / marca -->
        <div class="text-center mb-8">
            <h1 class="font-display font-bold text-2xl tracking-tight text-white">
                NOXAS <span class="text-teal">Service PC</span>
            </h1>
            <p class="text-muted text-xs font-display uppercase tracking-widest mt-1">
                // Panel de Administración
            </p>
        </div>

        <!-- Aviso de logout exitoso -->
        <div th:if="${param.logout}" class="mb-4 p-3 rounded-sm bg-teal/10 border border-teal/30 text-teal text-sm">
            Sesión cerrada correctamente.
        </div>

        <!-- Aviso de error de login -->
        <div th:if="${param.error}" class="mb-4 p-3 rounded-sm bg-red-500/10 border border-red-500/30 text-red-300 text-sm">
            Usuario o contraseña incorrectos.
        </div>

        <!-- Form de login -->
        <form th:action="@{/admin/login}" method="post" class="space-y-5">

            <div>
                <label for="username" class="block text-xs font-display uppercase tracking-wider text-muted mb-2">
                    Usuario
                </label>
                <input type="text" id="username" name="username" required autofocus
                       class="w-full px-4 py-3 bg-navy border border-border-dim rounded-sm text-white text-sm focus:outline-none focus:border-teal transition-colors"
                       placeholder="admin">
            </div>

            <div>
                <label for="password" class="block text-xs font-display uppercase tracking-wider text-muted mb-2">
                    Contraseña
                </label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-3 bg-navy border border-border-dim rounded-sm text-white text-sm focus:outline-none focus:border-teal transition-colors"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full font-display text-sm font-semibold uppercase tracking-wider bg-primary hover:bg-primary-hover text-white py-3 rounded-sm transition-colors">
                Ingresar
            </button>

        </form>

        <!-- Footer del card -->
        <div class="mt-6 pt-6 border-t border-border-dim text-center">
            <p class="text-[11px] text-muted font-display uppercase tracking-wider">
                Acceso restringido
            </p>
        </div>

    </div>

    <p class="text-center text-[11px] text-muted mt-6">
        © 2026 NOXAS Service PC · CABA, Argentina
    </p>
</div>

</body>
</html>
