spring.application.name=reparaciones
spring.config.import=optional:classpath:application-local.properties

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/reparaciones_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== Encoding =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true



# Cobertura (radio en km desde tu base)
app.cobertura.latitud-base=-34.6037
app.cobertura.longitud-base=-58.3816
app.cobertura.radio-km=15

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}


# ============================================
# MAIL - Gmail SMTP
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email de la empresa (para el "from" y para recibir notificaciones)
app.mail.from=${MAIL_FROM}
app.mail.from-name=NOXAS Service PC
app.mail.notificacion=${MAIL_NOTIF}